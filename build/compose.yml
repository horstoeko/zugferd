services:
  kosit-validator:
    image: apps4everything/kosit-validator-xrechnung:3.0.2-3@sha256:1cb2405a0ec7300b9661c45891deef0436567eaaf89bbc00807930904e6bee3b
    ports:
      - '8081:8081'

  verapdf-validator:
    image: verapdf/rest:v1.30.4@sha256:09ce9242f5ea27bfb464334cee5e984ef50d7b1f6f7d7e51fe6e933cfdd8d49d
    ports:
      - '8080:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/api/info || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
