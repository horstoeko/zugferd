name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_AUDIT: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"
  XDEBUG_MODE: off
  KOSIT_REMOTE_HOST: 127.0.0.1
  KOSIT_REMOTE_PORT: "8081"
  VERAPDF_REMOTE_HOST: 127.0.0.1
  VERAPDF_REMOTE_PORT: "8080"

jobs:
  build:
    permissions:
      contents: write
      checks: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, fileinfo, libxml, mbstring, simplexml, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick, json, xdebug
          tools: composer:v2
          coverage: xdebug
          ini-values: memory_limit=-1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
          require-lock-file: false
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Prepare build directories
        run: |
          mkdir -p build/builddoc
          mkdir -p build/coverage
          mkdir -p build/coverage-html
          mkdir -p build/dist
          mkdir -p build/logs
          mkdir -p build/phpcsfixer-cache
          mkdir -p build/phpstan-cache
          mkdir -p build/phpunit-cache
          mkdir -p build/rector-cache

      - name: Run parallel lint
        run: vendor/bin/parallel-lint --exclude src/codelistsenum src tests

      - name: Run PHP 8.1 enum lint
        if: ${{ contains(fromJSON('["8.1","8.2","8.3","8.4","8.5"]'), matrix.phpversion) }}
        run: vendor/bin/parallel-lint src/codelistsenum

      - name: Restore quality tools cache
        id: quality-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
            build/rector-cache
          key: ${{ runner.os }}-quality-php-8.5-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quality-php-8.5-

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --config=build/phpcsfixer.php --dry-run --no-interaction

      - name: Run PHPStan
        run: php -d sys_temp_dir=$(pwd)/build/phpstan-cache vendor/bin/phpstan analyze -c build/phpstan.neon --autoload-file=vendor/autoload.php --no-interaction --memory-limit 4G --error-format=github

      - name: Run Rector
        run: vendor/bin/rector --config=build/phprectorconfig.php --dry-run

      - name: Run reader path check
        run: php make/checkreaderpaths.php

      - name: Run PHPUnit tests
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --stop-on-failure --configuration build/phpunit.xml

      - name: Save quality tools cache
        if: ${{ !cancelled() && steps.quality-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
            build/rector-cache
          key: ${{ steps.quality-cache-restore.outputs.cache-primary-key }}

      - name: Start validation services
        run: docker compose --file .github/services/compose.yml up --detach --quiet-pull --wait --wait-timeout 120

      - name: Run remote Schematron tests
        run: |
          expectedResultAnchor='<rep:assessment><rep:accept>'

          for generator in \
            examples/01_ZugferdDocumentBuilder_EN16931.php \
            examples/01_ZugferdDocumentBuilder_XRECHNUNG3.php
          do
            rm -f examples/factur-x.xml
            php -f "$generator"
            test -s examples/factur-x.xml

            if ! kositValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Content-Type: application/xml' \
              --data-binary '@examples/factur-x.xml' \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$KOSIT_REMOTE_HOST:$KOSIT_REMOTE_PORT/factur-x.xml")
            then
              echo "KoSIT validation request failed for $generator." >&2
              exit 1
            fi

            if [ "${kositValidationResult##*$'\n'}" != '200' ] ||
              [[ "${kositValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]]
            then
              echo "KoSIT returned an unexpected result for $generator." >&2
              exit 1
            fi
          done

          echo 'Remote Schematron tests passed.'

      - name: Run remote veraPDF tests
        run: |
          expectedResultAnchor='<validationReports compliant="1" nonCompliant="0" failedJobs="0">1</validationReports>'

          for generator in \
            examples/02_ZugferdDocumentPdfBuilder_EN16931.php \
            examples/02_ZugferdDocumentPdfBuilder_XRECHNUNG.php
          do
            php -f "$generator"
            pdfFilename=examples/02_ZugferdDocumentPdfBuilder_PrintLayout_Merged.pdf
            test -s "$pdfFilename"

            if ! veraPdfValidationResult=$(curl \
              --silent \
              --show-error \
              --header 'Accept: application/xml' \
              --form "file=@$pdfFilename;type=application/pdf" \
              --max-time 120 \
              --write-out $'\n%{http_code}' \
              "http://$VERAPDF_REMOTE_HOST:$VERAPDF_REMOTE_PORT/api/validate/3b")
            then
              echo "veraPDF validation request failed for $generator." >&2
              exit 1
            fi

            if [ "${veraPdfValidationResult##*$'\n'}" != '200' ] ||
              [[ "${veraPdfValidationResult%$'\n'*}" != *"$expectedResultAnchor"* ]]
            then
              echo "veraPDF returned an unexpected result for $generator." >&2
              exit 1
            fi
          done

          echo 'Remote veraPDF tests passed.'

      - name: Package release artifacts
        run: zip -r build/dist/builddoc.zip build/builddoc build/coverage build/coverage-html build/logs

      - name: Publish unit test results
        continue-on-error: true
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/logs/junit.xml
          comment_mode: ${{ github.event_name == 'pull_request' && 'failures' || 'always' }}

      - name: Publish build log artifacts
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Build log artifacts for PHP 8.5 (Release)
          path: build/logs
          if-no-files-found: error

      - name: Generate release notes
        run: |
          curr_tag="$GITHUB_REF_NAME"
          prev_tag=$(git tag -l --sort=-v:refname | grep -Fxv "$curr_tag" | sed -n '1p')

          if [ -z "$prev_tag" ]; then
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Previous tag .... $prev_tag"
          echo "Current tag ..... $curr_tag"

          git log --no-merges --pretty=format:'- %s (%an)' "$prev_tag..$curr_tag" \
            | grep -Ev '^\- \[INFR\]|\- \[CS\] |\- \[DOC\] ' \
            | sed -E 's/^- (#.*)/- [ENH] \1/' \
            > build/releasenotes.txt || true

          touch build/releasenotes.txt
          cat build/releasenotes.txt

      - name: Generate SBOM
        continue-on-error: true
        run: |
          composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction --no-progress cyclonedx/cyclonedx-php-composer
          composer CycloneDX:make-sbom --omit=dev --output-format=JSON --output-file=build/dist/sbom.json
          composer CycloneDX:make-sbom --omit=dev --output-format=XML --output-file=build/dist/sbom.xml

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: build/dist/*
          artifactErrorsFailBuild: true
          immutableCreate: true
          bodyFile: build/releasenotes.txt
