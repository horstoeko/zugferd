name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPOSER_NO_AUDIT: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_PROCESS_TIMEOUT: "0"
  XDEBUG_MODE: off
  VALIDATORURL: https://github.com/itplr-kosit/validator/releases/download/v1.5.0/validator-1.5.0-distribution.zip
  VALIDATORSCENARIOURL: https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/release-2025-03-21/validator-configuration-xrechnung_3.0.2_2025-03-21.zip
  VALIDATORPATH: build/validator
  VALIDATORZIPFILENAME: validator.zip
  VALIDATORSCENARIOZIPFILENAME: validator-configuration.zip
  VALIDATORJARFILENAME: validationtool-1.5.0-standalone.jar
  VALIDATORSCENARIOFILENAME: scenarios.xml
  VERAPDFURL: https://software.verapdf.org/rel/verapdf-installer.zip
  VERAPDFPATH: build/verapdf
  VERAPDFZIPFILENAME: verapdf.zip

jobs:
  quality:
    name: Code quality
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: dom, curl, fileinfo, libxml, mbstring, simplexml, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick, json
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        run: composer update --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Prepare quality directories
        run: |
          mkdir -p build/logs
          mkdir -p build/phpcsfixer-cache
          mkdir -p build/phpstan-cache
          mkdir -p build/phpunit-cache
          mkdir -p build/rector-cache

      - name: Run parallel lint
        run: vendor/bin/parallel-lint src tests

      - name: Restore quality tools cache
        id: quality-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
            build/rector-cache
          key: ${{ runner.os }}-quality-php-7.4-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quality-php-7.4-

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --config=build/phpcsfixer.php --dry-run --no-interaction --diff

      - name: Run PHPStan
        run: php -d sys_temp_dir=$(pwd)/build/phpstan-cache vendor/bin/phpstan analyze -c build/phpstan.neon --autoload-file=vendor/autoload.php --no-interaction --memory-limit 4G --error-format=github

      - name: Run Rector
        run: vendor/bin/rector --config=build/phprectorconfig.php --dry-run

      - name: Run reader path check
        run: php make/checkreaderpaths.php

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --stop-on-failure --configuration build/phpunit.xml --no-coverage

      - name: Save quality tools cache
        if: ${{ !cancelled() && steps.quality-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            build/phpcsfixer-cache
            build/phpstan-cache
            build/phpunit-cache
            build/rector-cache
          key: ${{ steps.quality-cache-restore.outputs.cache-primary-key }}

  build:
    name: Build release
    needs: quality
    permissions:
      contents: write
      checks: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, fileinfo, libxml, mbstring, simplexml, zip, pcntl, pdo, bcmath, intl, gd, exif, iconv, imagick, json, xdebug
          coverage: xdebug
          tools: composer:v2, phpunit:9.6
          ini-values: memory_limit=-1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: temurin

      - name: Install runtime dependencies
        run: composer update --no-dev --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Prepare build directories
        run: |
          mkdir -p build/builddoc
          mkdir -p build/coverage
          mkdir -p build/coverage-html
          mkdir -p build/dist
          mkdir -p build/logs
          mkdir -p build/phpunit-cache

      - name: Run PHP lint
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit tests
        env:
          XDEBUG_MODE: coverage
        run: phpunit --stop-on-failure --configuration build/phpunit.xml

      - name: Cache key for Schematron validator
        id: hash-validator
        run: echo "hash=$(printf '%s' \"$VALIDATORURL $VALIDATORSCENARIOURL\" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Schematron validator
        id: cache-validator
        uses: actions/cache@v6
        with:
          path: ${{ env.VALIDATORPATH }}
          key: ${{ runner.os }}-validator-${{ steps.hash-validator.outputs.hash }}

      - name: Download Schematron validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          rm -rf "$VALIDATORPATH"
          mkdir -p "$VALIDATORPATH"
          wget "$VALIDATORURL" -O "$VALIDATORPATH/$VALIDATORZIPFILENAME"
          wget "$VALIDATORSCENARIOURL" -O "$VALIDATORPATH/$VALIDATORSCENARIOZIPFILENAME"
          unzip "$VALIDATORPATH/$VALIDATORZIPFILENAME" -d "$VALIDATORPATH"
          unzip "$VALIDATORPATH/$VALIDATORSCENARIOZIPFILENAME" -d "$VALIDATORPATH"

      - name: Run Schematron tests
        run: |
          set -euo pipefail
          for generator in \
            examples/01_ZugferdDocumentBuilder_EN16931.php \
            examples/01_ZugferdDocumentBuilder_XRECHNUNG3.php
          do
            rm -f examples/factur-x.xml
            php -f "$generator"
            test -s examples/factur-x.xml
            java -jar "$VALIDATORPATH/$VALIDATORJARFILENAME" \
              -r "$VALIDATORPATH" \
              -s "$VALIDATORPATH/$VALIDATORSCENARIOFILENAME" \
              examples/factur-x.xml
          done

      - name: Cache key for veraPDF
        id: hash-verapdf
        run: echo "hash=$(printf '%s' \"$VERAPDFURL\" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache veraPDF
        id: cache-verapdf
        uses: actions/cache@v6
        with:
          path: ${{ env.VERAPDFPATH }}
          key: ${{ runner.os }}-verapdf-${{ steps.hash-verapdf.outputs.hash }}

      - name: Download veraPDF
        if: steps.cache-verapdf.outputs.cache-hit != 'true'
        run: |
          rm -rf "$VERAPDFPATH"
          mkdir -p "$VERAPDFPATH"
          wget "$VERAPDFURL" -O "$VERAPDFPATH/$VERAPDFZIPFILENAME"
          unzip -j "$VERAPDFPATH/$VERAPDFZIPFILENAME" -d "$VERAPDFPATH"
          rm -f "$VERAPDFPATH/$VERAPDFZIPFILENAME"

      - name: Run veraPDF tests
        run: |
          set -euo pipefail
          cat > "$VERAPDFPATH/install.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$(pwd)/$VERAPDFPATH</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="1" name="veraPDF Validation model" selected="true"/>
                  <pack index="2" name="veraPDF Documentation" selected="true"/>
                  <pack index="3" name="veraPDF Sample Plugins" selected="true"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF

          veraPdfInstallerJar=$(find "$VERAPDFPATH" -type f -name '*.jar' | head -n 1)
          test -n "$veraPdfInstallerJar"
          java -jar "$veraPdfInstallerJar" "$VERAPDFPATH/install.xml"

          for generator in \
            examples/02_ZugferdDocumentPdfBuilder_EN16931.php \
            examples/02_ZugferdDocumentPdfBuilder_XRECHNUNG.php
          do
            php -f "$generator"
            pdfFilename=examples/02_ZugferdDocumentPdfBuilder_PrintLayout_Merged.pdf
            test -s "$pdfFilename"
            veraPdfResult=$("$VERAPDFPATH/verapdf" --format text --flavour 3b --loglevel 0 "$pdfFilename")
            echo "$veraPdfResult"
            [[ "$veraPdfResult" == PASS* ]]
          done

      - name: Package release artifacts
        run: |
          zip -r build/dist/builddoc.zip build/builddoc build/coverage build/coverage-html build/logs

      - name: Publish unit test results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/logs/junit.xml

      - name: Publish build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Build log artifacts for PHP 8.5 (Release)
          path: build/logs
          if-no-files-found: error

      - name: Generate release notes
        run: |
          curr_tag="$GITHUB_REF_NAME"
          prev_tag=$(git tag -l --sort=-v:refname | grep -Fxv "$curr_tag" | sed -n '1p')

          if [ -z "$prev_tag" ]; then
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Previous tag .... $prev_tag"
          echo "Current tag ..... $curr_tag"

          git log --no-merges --pretty=format:'- %s (%an)' "$prev_tag..$curr_tag" \
            | grep -Ev '^\- \[INFR\]|\- \[CS\] |\- \[DOC\] ' \
            | sed -E 's/^- (#.*)/- [ENH] \1/' \
            > build/releasenotes.txt || true

          touch build/releasenotes.txt
          cat build/releasenotes.txt

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: build/dist/*
          artifactErrorsFailBuild: true
          immutableCreate: true
          bodyFile: build/releasenotes.txt
