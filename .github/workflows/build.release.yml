name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        run: |
          mkdir -p build

          currentTag="$GITHUB_REF_NAME"
          currentCommit=$(git rev-list -n 1 "$currentTag")
          previousTag=$(git describe --tags --match 'v*' --abbrev=0 "${currentCommit}^" 2>/dev/null || true)

          echo "Previous tag .... ${previousTag:-<none>}"
          echo "Current tag ..... $currentTag"

          if [ -n "$previousTag" ]; then
            releaseRange="$previousTag..$currentTag"
          else
            releaseRange="$currentTag"
          fi

          git log --no-merges --pretty=format:'- %s (%an)' "$releaseRange" \
            | awk '
                /^- \[(INFR|CS|DOC)\] / { next }
                /^- #/ { sub(/^- /, "- [ENH] ") }
                { print }
              ' \
            > build/releasenotes.txt

          touch build/releasenotes.txt
          cat build/releasenotes.txt

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          immutableCreate: true
          skipIfReleaseExists: true
          bodyFile: build/releasenotes.txt
